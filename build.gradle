plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

repositories {
    mavenCentral()
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', ''
        systemProperty 'forge.logging.console.level', 'info'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    // Libraries that must be physically embedded in the mod jar.
    embedded
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // MP3 decoding (LGPL-2.1); bundled into the jar, see NOTICE
    implementation 'javazoom:jlayer:1.0.1'
    embedded 'javazoom:jlayer:1.0.1'
    // AAC decoding for Bilibili streams (public domain)
    implementation 'de.sfuhrm:jaad:0.8.7'
    embedded 'de.sfuhrm:jaad:0.8.7'
    // QR codes for login (Apache-2.0)
    implementation 'com.google.zxing:core:3.5.3'
    embedded 'com.google.zxing:core:3.5.3'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Embed the JLayer decoder classes so the mod works without extra libraries
    from({ configurations.embedded.collect { zipTree(it) } }) {
        exclude 'META-INF/**'
    }
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : 'SimplePlayer',
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : 'SimplePlayer',
        ])
    }
}
